<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="gh-stats-title gh-stats-desc">
  <title id="gh-stats-title">Souvik Dey — GitHub Activity &amp; Analytics</title>
  <desc id="gh-stats-desc">Editorial data visualization of GitHub statistics, contribution streak, and language breakdown in warm neo-brutalist style.</desc>
  <defs>
    <pattern id="gh-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#6B6255" opacity="0.08" />
    </pattern>
    <clipPath id="gh-outer">
      <rect x="1" y="1" width="1198" height="678" rx="22" />
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Inter', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #171717; }
    .heading { font-family: 'Barlow Condensed', 'Roboto Condensed', 'Archivo Narrow', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; letter-spacing: 0.5px; fill: #171717; }
    .num { font-family: 'Barlow Condensed', 'Roboto Condensed', 'Archivo Narrow', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -0.5px; fill: #171717; }
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-weight: 500; fill: #6B6255; }
    .mono-bold { font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-weight: 700; }
  </style>

  <g clip-path="url(#gh-outer)">
    <!-- Container background & border -->
    <rect x="1" y="1" width="1198" height="678" rx="22" fill="#F3EBDD" stroke="#171717" stroke-width="2" />
    <rect x="2" y="2" width="1196" height="676" rx="21" fill="url(#gh-dots)" stroke="none" />

    <!-- Section Header -->
    <text x="44" y="44" font-size="11" fill="#6B6255" class="mono" letter-spacing="1.6">05 / GITHUB ACTIVITY</text>
    <text x="42" y="85" font-size="38" class="heading">CODE IN PUBLIC.</text>
    <text x="44" y="110" font-size="12" fill="#6B6255" class="mono">A snapshot of what I've been building, contributing and learning.</text>

    <!-- Decorative brutalist accent slashes -->
    <path d="M1107 48l9 0 -7 18h-9Z" fill="#E85D3F" />
    <path d="M1119 48l9 0 -7 18h-9Z" fill="#E85D3F" />
    <path d="M1131 48l9 0 -7 18h-9Z" fill="#E85D3F" />

    <!-- ==================== TOP LEFT CARD: GITHUB STATS ==================== -->
    <!-- Card Shadow -->
    <rect x="48" y="144" width="536" height="236" rx="12" fill="#171717" stroke="none" />
    <!-- Card Surface -->
    <rect x="44" y="140" width="536" height="236" rx="12" fill="#FFF9EE" stroke="#171717" stroke-width="2" />
    <!-- Card Accent Stripe -->
    <rect x="44" y="140" width="5" height="236" rx="2" fill="#FFB000" stroke="none" />

    <!-- Card Label -->
    <text x="68" y="172" font-size="11" fill="#6B6255" class="mono" letter-spacing="1.4">METRICS / REPOSITORIES</text>

    <!-- Main Highlight: 18 TOTAL STARS -->
    <g transform="translate(68, 194)">
      <!-- Star Icon -->
      <g transform="translate(0, 4) scale(1.1)" fill="#FFB000">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </g>
      <!-- Big Number -->
      <text x="36" y="38" font-size="52" class="num">18</text>
      <!-- Metric Label -->
      <text x="100" y="24" font-size="14" class="heading" letter-spacing="0.8">TOTAL STARS</text>
      <text x="100" y="40" font-size="11" fill="#6B6255" class="mono">Earned across public repositories</text>
    </g>

    <!-- Divider Line -->
    <line x1="68" y1="262" x2="385" y2="262" stroke="#171717" stroke-width="1.5" stroke-opacity="0.2" />

    <!-- Supporting 4 Metrics Grid (2x2) -->
    <!-- Metric 1: Commits -->
    <g transform="translate(68, 276)">
      <circle cx="6" cy="11" r="5" fill="#FFF9EE" stroke="#FFB000" stroke-width="1.5" />
      <path d="M6 8v3l2 1" stroke="#FFB000" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <text x="18" y="16" font-size="22" class="num">1.7k</text>
      <text x="64" y="10" font-size="10" class="heading" letter-spacing="0.5">COMMITS</text>
      <text x="64" y="21" font-size="9" fill="#6B6255" class="mono">last year</text>
    </g>

    <!-- Metric 2: PRs -->
    <g transform="translate(230, 276)">
      <path d="M4 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm8-10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M4 6v6 M12 8v2a2 2 0 0 1-2 2H6" stroke="#FFB000" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <text x="20" y="16" font-size="22" class="num">17</text>
      <text x="52" y="10" font-size="10" class="heading" letter-spacing="0.5">PULL REQUESTS</text>
      <text x="52" y="21" font-size="9" fill="#6B6255" class="mono">submitted &amp; merged</text>
    </g>

    <!-- Metric 3: Issues -->
    <g transform="translate(68, 318)">
      <circle cx="6" cy="11" r="5.5" fill="none" stroke="#E85D3F" stroke-width="1.5" />
      <circle cx="6" cy="11" r="1.5" fill="#E85D3F" />
      <text x="18" y="16" font-size="22" class="num">3</text>
      <text x="44" y="10" font-size="10" class="heading" letter-spacing="0.5">ISSUES</text>
      <text x="44" y="21" font-size="9" fill="#6B6255" class="mono">opened</text>
    </g>

    <!-- Metric 4: Contributed To -->
    <g transform="translate(230, 318)">
      <path d="M3 4h10v12H3z M5 8h6 M5 12h4" stroke="#FFB000" stroke-width="1.4" stroke-linecap="round" fill="none" />
      <text x="20" y="16" font-size="22" class="num">8</text>
      <text x="44" y="10" font-size="10" class="heading" letter-spacing="0.5">CONTRIBUTED TO</text>
      <text x="44" y="21" font-size="9" fill="#6B6255" class="mono">repos last year</text>
    </g>

    <!-- Editorial Performance Marker: B- Grade Badge -->
    <g transform="translate(432, 175)">
      <!-- Marker Card Background -->
      <rect x="0" y="0" width="124" height="176" rx="8" fill="#F3EBDD" stroke="#171717" stroke-width="1.5" />
      <text x="62" y="24" text-anchor="middle" font-size="9" fill="#6B6255" class="mono" letter-spacing="1">INDEX RANK</text>
      
      <!-- Circular Arc Gauge -->
      <circle cx="62" cy="78" r="38" fill="none" stroke="#D7CCB8" stroke-width="5" />
      <!-- Gauge Progress: approx 58% circumference (2 * pi * 38 = 238.7) => 138 stroke-dasharray -->
      <circle cx="62" cy="78" r="38" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="148 240" stroke-dashoffset="60" stroke-linecap="round" />
      <circle cx="62" cy="78" r="38" fill="none" stroke="#FFB000" stroke-width="5" stroke-dasharray="24 240" stroke-dashoffset="60" stroke-linecap="round" />
      
      <!-- Grade text -->
      <text x="62" y="87" text-anchor="middle" font-size="34" class="num">B-</text>
      
      <!-- Marker Caption -->
      <rect x="22" y="128" width="80" height="20" rx="4" fill="#171717" />
      <text x="62" y="142" text-anchor="middle" font-size="9" fill="#FFF9EE" class="mono-bold" letter-spacing="1">GITHUB PASS</text>
      <text x="62" y="162" text-anchor="middle" font-size="8.5" fill="#6B6255" class="mono">TOP 40% TIER</text>
    </g>

    <!-- ==================== TOP RIGHT CARD: STREAK CARD ==================== -->
    <!-- Card Shadow -->
    <rect x="620" y="144" width="536" height="236" rx="12" fill="#171717" stroke="none" />
    <!-- Card Surface -->
    <rect x="616" y="140" width="536" height="236" rx="12" fill="#FFF9EE" stroke="#171717" stroke-width="2" />
    <!-- Card Accent Stripe -->
    <rect x="616" y="140" width="5" height="236" rx="2" fill="#E85D3F" stroke="none" />

    <!-- Card Label -->
    <text x="640" y="172" font-size="11" fill="#6B6255" class="mono" letter-spacing="1.4">ACTIVITY CONSISTENCY / TIMELINE</text>

    <!-- 3-Column Asymmetric Metrics Layout -->
    <!-- Left Column: Total Contributions (Quieter) -->
    <g transform="translate(640, 204)">
      <text x="0" y="42" font-size="44" class="num" fill="#171717">2,359</text>
      <text x="0" y="66" font-size="12" class="heading" letter-spacing="0.5">TOTAL CONTRIBUTIONS</text>
      <text x="0" y="82" font-size="10" fill="#6B6255" class="mono">Jun 28, 2025 – Present</text>
      
      <!-- Small indicator tag -->
      <rect x="0" y="98" width="86" height="18" rx="3" fill="#F3EBDD" stroke="#171717" stroke-width="1" />
      <text x="43" y="111" text-anchor="middle" font-size="9" fill="#171717" class="mono">ALL-TIME LOG</text>
    </g>

    <!-- Vertical Divider 1 -->
    <line x1="814" y1="194" x2="814" y2="348" stroke="#171717" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Center Column: Current Streak (HERO FOCUS with Mustard Circular Ring) -->
    <g transform="translate(830, 186)">
      <!-- Flame Icon over badge -->
      <g transform="translate(60, 4) scale(0.9)" fill="#E85D3F">
        <path d="M8.5 14.5c-.8-1.5-.7-3.1.2-4.5 1.5 1.4 3.3 2.1 3.3 4.5 0 2-1.6 3.5-3.5 3.5s-3.5-1.5-3.5-3.5c0-1.8 1.1-3.6 2.5-5.2.2 1.4.6 2.3 1 3.2 0-.9.2-2.1.8-3.1 1.6-2.5 1.7-4.4 1.2-5.9 3.2 2.1 5 5.2 5 8.5 0 3.9-3.1 7-7 7s-7-3.1-7-7c0-4.3 2.8-7.9 6-9.5-.4 2-.1 3.9 1 5z" />
      </g>
      
      <!-- Thin Mustard Circular Indicator Ring -->
      <circle cx="68" cy="68" r="46" fill="#F3EBDD" stroke="#FFB000" stroke-width="2.5" />
      <circle cx="68" cy="68" r="41" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
      
      <!-- Dominant Number: 12 -->
      <text x="68" y="78" text-anchor="middle" font-size="52" class="num">12</text>
      
      <!-- Labeling below ring -->
      <text x="68" y="132" text-anchor="middle" font-size="13" class="heading" fill="#171717" letter-spacing="0.8">CURRENT STREAK</text>
      <text x="68" y="148" text-anchor="middle" font-size="10" fill="#E85D3F" class="mono-bold">ACTIVE: Sep 25 – Oct 6</text>
    </g>

    <!-- Vertical Divider 2 -->
    <line x1="982" y1="194" x2="982" y2="348" stroke="#171717" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Right Column: Longest Streak (Quieter) -->
    <g transform="translate(1006, 204)">
      <text x="0" y="42" font-size="44" class="num" fill="#171717">19</text>
      <text x="0" y="66" font-size="12" class="heading" letter-spacing="0.5">LONGEST STREAK</text>
      <text x="0" y="82" font-size="10" fill="#6B6255" class="mono">Jan 9 – Jan 27</text>
      
      <!-- Small indicator tag -->
      <rect x="0" y="98" width="76" height="18" rx="3" fill="#F3EBDD" stroke="#171717" stroke-width="1" />
      <text x="38" y="111" text-anchor="middle" font-size="9" fill="#171717" class="mono">PERSONAL BEST</text>
    </g>

    <!-- ==================== BOTTOM CARD: LANGUAGE BREAKDOWN ==================== -->
    <!-- Card Shadow -->
    <rect x="48" y="408" width="1108" height="236" rx="12" fill="#171717" stroke="none" />
    <!-- Card Surface -->
    <rect x="44" y="404" width="1108" height="236" rx="12" fill="#FFF9EE" stroke="#171717" stroke-width="2" />
    <!-- Card Accent Stripe -->
    <rect x="44" y="404" width="5" height="236" rx="2" fill="#171717" stroke="none" />

    <!-- Header Section in Language Card -->
    <text x="68" y="432" font-size="11" fill="#6B6255" class="mono" letter-spacing="1.6">06 / LANGUAGE MIX</text>
    <text x="68" y="462" font-size="28" class="heading">LANGUAGE BREAKDOWN</text>
    <text x="68" y="481" font-size="11" fill="#6B6255" class="mono">Codebase composition across production systems &amp; open source projects</text>

    <!-- Restrained Horizontal Distribution Bar -->
    <!-- Bar dimensions: x=68, y=498, width=1058, height=14 -->
    <!-- Segments:
         TypeScript:       37.79% -> 399.8px  fill="#171717"
         JavaScript:       31.73% -> 335.7px  fill="#FFB000"
         HTML:             14.28% -> 151.1px  fill="#E85D3F"
         CSS:               9.49% -> 100.4px  fill="#6B6255"
         Jupyter Notebook:  4.44% ->  47.0px  fill="#D7CCB8"
         Python:            2.27% ->  24.0px  fill="#171717" (hatched/accent)
    -->
    <g transform="translate(68, 498)">
      <!-- Outer Bar Border & Clip -->
      <clipPath id="lang-bar-clip">
        <rect x="0" y="0" width="1058" height="14" rx="7" />
      </clipPath>
      <rect x="0" y="0" width="1058" height="14" rx="7" fill="#F3EBDD" stroke="#171717" stroke-width="1.5" />
      
      <g clip-path="url(#lang-bar-clip)">
        <!-- TypeScript (37.79%) -->
        <rect x="0" y="0" width="399.8" height="14" fill="#171717" />
        <!-- JavaScript (31.73%) -->
        <rect x="399.8" y="0" width="335.7" height="14" fill="#FFB000" />
        <!-- HTML (14.28%) -->
        <rect x="735.5" y="0" width="151.1" height="14" fill="#E85D3F" />
        <!-- CSS (9.49%) -->
        <rect x="886.6" y="0" width="100.4" height="14" fill="#6B6255" />
        <!-- Jupyter Notebook (4.44%) -->
        <rect x="987.0" y="0" width="47.0" height="14" fill="#D7CCB8" />
        <!-- Python (2.27%) -->
        <rect x="1034.0" y="0" width="24.0" height="14" fill="#171717" />
      </g>
    </g>

    <!-- Compact Editorial Language Rows (2 Columns x 3 Rows) -->
    <!-- Left Column (Col 1: x=68 to x=540) -->
    <!-- Row 1: TypeScript -->
    <g transform="translate(68, 542)">
      <!-- Marker 01 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#171717" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#FFF9EE" class="mono-bold">01</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#171717" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">TypeScript</text>
      <!-- Dotted leader line -->
      <line x1="130" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">37.79%</text>
    </g>

    <!-- Row 2: JavaScript -->
    <g transform="translate(68, 574)">
      <!-- Marker 02 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#FFB000" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#171717" class="mono-bold">02</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#FFB000" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">JavaScript</text>
      <!-- Dotted leader line -->
      <line x1="128" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">31.73%</text>
    </g>

    <!-- Row 3: HTML -->
    <g transform="translate(68, 606)">
      <!-- Marker 03 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#E85D3F" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#FFF9EE" class="mono-bold">03</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#E85D3F" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">HTML</text>
      <!-- Dotted leader line -->
      <line x1="88" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">14.28%</text>
    </g>

    <!-- Right Column (Col 2: x=616 to x=1090) -->
    <!-- Row 4: CSS -->
    <g transform="translate(640, 542)">
      <!-- Marker 04 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#6B6255" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#FFF9EE" class="mono-bold">04</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#6B6255" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">CSS</text>
      <!-- Dotted leader line -->
      <line x1="80" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">9.49%</text>
    </g>

    <!-- Row 5: Jupyter Notebook -->
    <g transform="translate(640, 574)">
      <!-- Marker 05 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#D7CCB8" stroke="#171717" stroke-width="1" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#171717" class="mono-bold">05</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#D7CCB8" stroke="#171717" stroke-width="0.8" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">Jupyter Notebook</text>
      <!-- Dotted leader line -->
      <line x1="172" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">4.44%</text>
    </g>

    <!-- Row 6: Python -->
    <g transform="translate(640, 606)">
      <!-- Marker 06 -->
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#171717" />
      <text x="12" y="13" text-anchor="middle" font-size="10" fill="#FFF9EE" class="mono-bold">06</text>
      <!-- Small color swatch -->
      <circle cx="34" cy="9" r="4" fill="#171717" />
      <!-- Language Name -->
      <text x="46" y="14" font-size="14" class="heading" letter-spacing="0.3">Python</text>
      <!-- Dotted leader line -->
      <line x1="102" y1="11" x2="400" y2="11" stroke="#6B6255" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Percentage -->
      <text x="460" y="14" text-anchor="end" font-size="13" class="mono-bold" fill="#171717">2.27%</text>
    </g>

  </g>
</svg>

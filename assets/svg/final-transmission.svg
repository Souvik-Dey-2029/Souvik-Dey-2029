<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="final-title final-desc">
  <title id="final-title">The Final Transmission — The Architect Never Stops Building</title>
  <desc id="final-desc">System status, build metrics, and closing developer manifesto for Souvik Dey.</desc>
  <defs>
    <linearGradient id="min-bg" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12100E" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif; font-weight: 800; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Clean dark background -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#min-bg)" />

  <!-- Clean Minimal Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="14" fill="none" stroke="#2B2620" stroke-width="1.5" />
  
  <!-- Subtle minimal corner ticks -->
  <path d="M 20 38 L 20 20 L 38 20" fill="none" stroke="#FFB000" stroke-width="2" />
  <path d="M 1180 38 L 1180 20 L 1162 20" fill="none" stroke="#FFB000" stroke-width="2" />
  <path d="M 20 442 L 20 460 L 38 460" fill="none" stroke="#FFB000" stroke-width="2" />
  <path d="M 1180 442 L 1180 460 L 1162 460" fill="none" stroke="#FFB000" stroke-width="2" />

  <!-- Top Minimal Telemetry HUD -->
  <g class="mono" font-size="10.5" letter-spacing="1.5">
    <text x="45" y="48" fill="#8C7A6B">SYS_ID // <tspan fill="#FFF9EE" font-weight="700">SD-2029</tspan></text>
    <text x="195" y="48" fill="#443B33">|</text>
    <text x="215" y="48" fill="#8C7A6B">CORE // <tspan fill="#FFF9EE">AI-ML-HIT</tspan></text>
    <text x="365" y="48" fill="#443B33">|</text>
    <text x="385" y="48" fill="#8C7A6B">TELEMETRY // <tspan fill="#FFB000">NOMINAL</tspan></text>
    
    <text x="945" y="48" fill="#8C7A6B">BUFFER // <tspan fill="#FFF9EE">100%</tspan></text>
    <text x="1065" y="48" fill="#443B33">|</text>
    <text x="1085" y="48" fill="#FFB000" font-weight="700">LIVE</text>
  </g>
  <line x1="45" y1="62" x2="1155" y2="62" stroke="#26211C" stroke-width="1" />

  <!-- 4 Minimal Compact Status Modules -->
  <!-- Module 1: SYSTEM STATUS -->
  <g transform="translate(45, 78)">
    <rect x="0" y="0" width="260" height="46" rx="6" fill="#171513" stroke="#2B2520" stroke-width="1" />
    <path d="M 0 0 L 260 0" stroke="#FFB000" stroke-width="2" />
    <text x="16" y="28" class="mono" font-size="9.5" fill="#8C7A6B" letter-spacing="1">SYSTEM STATUS</text>
    <text x="175" y="28" class="sans" font-size="13" font-weight="700" fill="#FFF9EE">ONLINE</text>
    <circle cx="162" cy="24" r="3.5" fill="#10B981" />
  </g>

  <!-- Module 2: BUILD STATUS -->
  <g transform="translate(325, 78)">
    <rect x="0" y="0" width="260" height="46" rx="6" fill="#171513" stroke="#2B2520" stroke-width="1" />
    <path d="M 0 0 L 260 0" stroke="#F59E0B" stroke-width="2" />
    <text x="16" y="28" class="mono" font-size="9.5" fill="#8C7A6B" letter-spacing="1">BUILD STATUS</text>
    <text x="150" y="28" class="sans" font-size="13" font-weight="700" fill="#FFF9EE">CONTINUOUS</text>
    <circle cx="138" cy="24" r="3.5" fill="#F59E0B" />
  </g>

  <!-- Module 3: NEXT MISSION -->
  <g transform="translate(605, 78)">
    <rect x="0" y="0" width="260" height="46" rx="6" fill="#171513" stroke="#2B2520" stroke-width="1" />
    <path d="M 0 0 L 260 0" stroke="#E8DDC8" stroke-width="2" />
    <text x="16" y="28" class="mono" font-size="9.5" fill="#8C7A6B" letter-spacing="1">NEXT MISSION</text>
    <text x="165" y="28" class="sans" font-size="13" font-weight="700" fill="#FFF9EE">UNKNOWN</text>
    <circle cx="152" cy="24" r="3.5" fill="#E8DDC8" />
  </g>

  <!-- Module 4: CORE ARCHITECT -->
  <g transform="translate(885, 78)">
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#171513" stroke="#2B2520" stroke-width="1" />
    <path d="M 0 0 L 270 0" stroke="#E85D3F" stroke-width="2" />
    <text x="16" y="28" class="mono" font-size="9.5" fill="#8C7A6B" letter-spacing="1">ARCHITECT</text>
    <text x="120" y="28" class="sans" font-size="13" font-weight="700" fill="#FFF9EE">Souvik-Dey-2029</text>
    <circle cx="108" cy="24" r="3.5" fill="#E85D3F" />
  </g>

  <!-- Centerpiece: Editorial Minimal Typography -->
  <g transform="translate(600, 210)">
    <!-- Minimal Monospace Tag -->
    <text x="0" y="-22" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#FFB000" letter-spacing="3">
      // THE FINAL TRANSMISSION
    </text>

    <!-- Main Bold Statement: Pure, high-contrast, zero clutter -->
    <text x="0" y="22" text-anchor="middle" class="heading" font-size="32" fill="#FFF9EE" letter-spacing="2">
      THE ARCHITECT NEVER STOPS BUILDING.
    </text>

    <!-- Supporting Line -->
    <text x="0" y="55" text-anchor="middle" class="sans" font-size="15" font-weight="400" fill="#A89E92" letter-spacing="0.5">
      Every system is a beginning. Every experiment leaves something behind.
    </text>
  </g>

  <!-- Minimal Understated Signature Line -->
  <g transform="translate(600, 350)">
    <line x1="-280" y1="-20" x2="280" y2="-20" stroke="#2B2520" stroke-width="1" />
    
    <text x="0" y="5" text-anchor="middle" class="mono" font-size="13" font-weight="500" fill="#FFF9EE" letter-spacing="1">
      &#8220;Designed through curiosity. Built through execution.&#8221;
    </text>
    <text x="0" y="26" text-anchor="middle" class="mono" font-size="10.5" fill="#8C7A6B" letter-spacing="2">
      — SOUVIK DEY // HIT CSE (AI &amp; ML) 2029 —
    </text>
  </g>

  <!-- Bottom Minimal Footer Bar -->
  <line x1="45" y1="415" x2="1155" y2="415" stroke="#221D19" stroke-width="1" />
  <g class="mono" font-size="9.5" letter-spacing="1.5" fill="#5E5348">
    <text x="45" y="438">/// END OF TRANSMISSION</text>
    <text x="465" y="438" fill="#8C7A6B">[ ALL BUILDS PERSISTED TO MAIN ]</text>
    <text x="980" y="438">LOC // 22.0645&#176; N, 88.0673&#176; E</text>
  </g>
</svg>
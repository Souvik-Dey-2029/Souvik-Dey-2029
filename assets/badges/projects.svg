  <text x="36" y="22.5" fill="#F2F5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Projects</text>
  <!-- Chevron Arrow -->

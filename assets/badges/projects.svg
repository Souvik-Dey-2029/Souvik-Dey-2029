    <linearGradient id="border_grad_projects" x1="0" y1="0" x2="120" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f3554" stop-opacity="0.8"/>

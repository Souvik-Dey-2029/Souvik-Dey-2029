<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Inter:wght@400;600&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .sans { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; }
      .heading { font-family: 'Space Grotesk', 'Arial Black', -apple-system, sans-serif; font-weight: 800; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Main Container Frame: 2px black border with 4px offset shadow in neo-brutalist style -->
  <!-- Outer shadow -->
  <rect x="25" y="25" width="1150" height="530" rx="16" fill="none" stroke="#000000" stroke-width="6" opacity="0.4" />
  <!-- Main border -->
  <rect x="20" y="20" width="1150" height="530" rx="16" fill="none" stroke="#38302A" stroke-width="2" />
  
  <!-- Corner Tech Accents -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#FFB000" stroke-width="3" />
  <path d="M 1170 45 L 1170 20 L 1145 20" fill="none" stroke="#FFB000" stroke-width="3" />
  <path d="M 20 525 L 20 550 L 45 550" fill="none" stroke="#FFB000" stroke-width="3" />
  <path d="M 1170 525 L 1170 550 L 1145 550" fill="none" stroke="#FFB000" stroke-width="3" />

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="50" y="52" fill="#B87932">SYS_ID // <tspan fill="#FFF9EE">SD-2029</tspan></text>
    <text x="210" y="52" fill="#665D52">|</text>
    <text x="235" y="52" fill="#B87932">STATION // <tspan fill="#FFF9EE">AI-ML-CORE</tspan></text>
    <text x="430" y="52" fill="#665D52">|</text>
    <text x="455" y="52" fill="#B87932">PROTOCOL // <tspan fill="#FFB000">DEEP-STREAM-v4.2</tspan></text>
    
    <text x="860" y="52" fill="#B87932">BUFFER // <tspan fill="#FFF9EE">100% NOMINAL</tspan></text>
    <text x="1025" y="52" fill="#665D52">|</text>
    <text x="1045" y="52" fill="#FFB000">LIVE FEED</text>
  </g>
  <line x1="50" y1="68" x2="1140" y2="68" stroke="#332B25" stroke-width="1" stroke-dasharray="4 4" />

  <!-- 4 System Status Modules -->
  <!-- Card 1: SYSTEM STATUS -->
  <g transform="translate(50, 88)">
    <rect x="3" y="3" width="250" height="72" rx="8" fill="#000000" opacity="0.5" />
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#1C1815" stroke="#3D352E" stroke-width="1.5" />
    <path d="M 0 0 L 250 0" stroke="#FFB000" stroke-width="3" rx="8" />
    <text x="16" y="26" class="mono" font-size="10" fill="#B87932" letter-spacing="1.2">SYSTEM STATUS</text>
    <text x="36" y="54" class="sans" font-size="18" font-weight="700" fill="#FFF9EE" letter-spacing="0.5">ONLINE</text>
    <!-- Dynamic LED placeholder: circle drawn here or animated in background -->
    <circle cx="22" cy="48" r="5" fill="#10B981" />
    <text x="175" y="53" class="mono" font-size="10" fill="#665D52">[01 / SYS]</text>
  </g>

  <!-- Card 2: BUILD STATUS -->
  <g transform="translate(330, 88)">
    <rect x="3" y="3" width="250" height="72" rx="8" fill="#000000" opacity="0.5" />
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#1C1815" stroke="#3D352E" stroke-width="1.5" />
    <path d="M 0 0 L 250 0" stroke="#F59E0B" stroke-width="3" rx="8" />
    <text x="16" y="26" class="mono" font-size="10" fill="#B87932" letter-spacing="1.2">BUILD STATUS</text>
    <text x="36" y="54" class="sans" font-size="18" font-weight="700" fill="#FFF9EE" letter-spacing="0.5">CONTINUOUS</text>
    <circle cx="22" cy="48" r="5" fill="#F59E0B" />
    <text x="175" y="53" class="mono" font-size="10" fill="#665D52">[02 / BLD]</text>
  </g>

  <!-- Card 3: NEXT MISSION -->
  <g transform="translate(610, 88)">
    <rect x="3" y="3" width="250" height="72" rx="8" fill="#000000" opacity="0.5" />
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#1C1815" stroke="#3D352E" stroke-width="1.5" />
    <path d="M 0 0 L 250 0" stroke="#E8DDC8" stroke-width="3" rx="8" />
    <text x="16" y="26" class="mono" font-size="10" fill="#B87932" letter-spacing="1.2">NEXT MISSION</text>
    <text x="36" y="54" class="sans" font-size="18" font-weight="700" fill="#FFF9EE" letter-spacing="0.5">UNKNOWN</text>
    <circle cx="22" cy="48" r="5" fill="#E8DDC8" />
    <text x="175" y="53" class="mono" font-size="10" fill="#665D52">[03 / OBJ]</text>
  </g>

  <!-- Card 4: CORE ARCHITECT -->
  <g transform="translate(890, 88)">
    <rect x="3" y="3" width="250" height="72" rx="8" fill="#000000" opacity="0.5" />
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#1C1815" stroke="#3D352E" stroke-width="1.5" />
    <path d="M 0 0 L 250 0" stroke="#E85D3F" stroke-width="3" rx="8" />
    <text x="16" y="26" class="mono" font-size="10" fill="#B87932" letter-spacing="1.2">CORE ARCHITECT</text>
    <text x="36" y="54" class="sans" font-size="16" font-weight="700" fill="#FFF9EE">Souvik-Dey-2029</text>
    <circle cx="22" cy="48" r="5" fill="#E85D3F" />
    <text x="175" y="53" class="mono" font-size="10" fill="#665D52">[04 / ID]</text>
  </g>

  <!-- Central Hero Section -->
  <g transform="translate(600, 240)">
    <!-- Neo-brutalist Technical Bracket Frame -->
    <path d="M -380 -40 L -410 -40 L -410 40 L -380 40" fill="none" stroke="#FFB000" stroke-width="3" />
    <path d="M 380 -40 L 410 -40 L 410 40 L 380 40" fill="none" stroke="#FFB000" stroke-width="3" />
    
    <!-- Central Category Badge -->
    <rect x="-85" y="-62" width="170" height="22" rx="4" fill="#FFB000" />
    <text x="0" y="-47" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#171717" letter-spacing="1.5">TRANSMISSION // 08</text>

    <!-- Main Hero Statement -->
    <text x="0" y="5" text-anchor="middle" class="heading" font-size="34" fill="#FFF9EE" letter-spacing="2">
      THE ARCHITECT NEVER STOPS BUILDING.
    </text>

    <!-- Supporting Line -->
    <text x="0" y="42" text-anchor="middle" class="sans" font-size="16" font-weight="500" fill="#D4C7B5" letter-spacing="0.5">
      Every system is a beginning. Every experiment leaves something behind.
    </text>
  </g>

  <!-- Signature Card -->
  <g transform="translate(600, 395)">
    <rect x="-377" y="-22" width="754" height="54" rx="8" fill="#000000" opacity="0.6" />
    <rect x="-380" y="-25" width="760" height="54" rx="8" fill="#1C1815" stroke="#3D352E" stroke-width="1.5" />
    <!-- Accent indicator tabs -->
    <path d="M -380 -5 L -380 15" stroke="#FFB000" stroke-width="3" />
    <path d="M 380 -5 L 380 15" stroke="#FFB000" stroke-width="3" />

    <text x="0" y="-1" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#FFF9EE" letter-spacing="1.2">
      &#8220;Designed through curiosity. Built through execution.&#8221;
    </text>
    <text x="0" y="18" text-anchor="middle" class="mono" font-size="10.5" fill="#B87932" letter-spacing="2">
      &#8212; SOUVIK DEY // HIT CSE (AI &amp; ML) 2029 &#8212;
    </text>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="50" y1="495" x2="1140" y2="495" stroke="#332B25" stroke-width="1" stroke-dasharray="3 3" />
  <g class="mono" font-size="10" letter-spacing="1.5" fill="#665D52">
    <text x="50" y="522">/// END OF TRANSMISSION</text>
    <text x="450" y="522" fill="#B87932">[ ALL ACTIVE BUILDS PERSISTED TO MAIN ]</text>
    <text x="965" y="522">LOC // 22.0645&#176; N, 88.0673&#176; E</text>
  </g>
</svg>